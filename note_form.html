{% extends 'base.html' %}
{% block content %}
<section class="editor-section"><div class="container editor-container">
  <a class="back-link" href="{{ url_for('dashboard') }}">← Back to my notes</a>
  <div class="editor-header"><p class="section-kicker">A PAGE JUST FOR YOU</p><h1>{{ "Edit your" if note else "What’s on your" }} <em>{{ 'note?' if note else 'mind?' }}</em></h1><p>No rules here. Just you and your thoughts.</p></div>
  <form method="post" class="editor-card" action="{{ url_for('edit_note', note_id=note.id) if note else url_for('new_note') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="editor-card-head"><span>✳ &nbsp; YOUR JOURNAL</span><span>JUST FOR YOU ♡</span></div>
    <label for="title">Give this thought a title</label>
    <input type="text" id="title" name="title" maxlength="100" required placeholder="Today I felt..." value="{{ request.form.get('title', note.title if note else '') }}">
    <label for="mood">How are you feeling?</label>
    <select name="mood" id="mood">
      {% set current_mood = request.form.get('mood', note.mood if note else 'reflective') %}
      {% for value, label in moods.items() %}<option value="{{ value }}" {% if current_mood == value %}selected{% endif %}>{{ label }}</option>{% endfor %}
    </select>
    <label for="content">Your thoughts</label>
    <textarea id="content" name="content" maxlength="4000" minlength="1" rows="11" placeholder="Dear journal, today was..." required>{{ request.form.get('content', note.content if note else '') }}</textarea>
    <div class="editor-bottom"><span class="character-count" data-character-count>0 / 4000</span><button class="btn btn-primary" type="submit">{{ 'Save changes' if note else 'Save my note' }} ↗</button></div>
  </form>
</div></section>
{% endblock %}
